<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001D3D"/>
      <stop offset="50%" stop-color="#003566"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#E6AF00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Deep Sea Gold Accents -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- FTI Geometric Crest Emblem -->
  <g transform="translate(100, 95) scale(0.85)" filter="url(#glow)">
    <!-- Shield Outer Poly -->
    <path d="M 0 -65 L 55 -30 L 55 35 L 0 65 L -55 35 L -55 -30 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Stylized 'F' Monogram -->
    <path d="M -28 -35 L 32 -35 M -28 -35 L -28 35 M -28 -3 L 18 -3" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gold Accent Node Points -->
    <circle cx="32" cy="-35" r="4" fill="#FFC300"/>
    <circle cx="18" cy="-3" r="4" fill="#FFC300"/>
    <circle cx="-28" cy="35" r="4" fill="#FFC300"/>
    <circle cx="0" cy="45" r="3" fill="url(#accentGrad)"/>
  </g>

  <!-- Year Label Tag -->
  <rect x="62" y="152" width="76" height="22" rx="11" fill="rgba(0, 29, 61, 0.95)" stroke="url(#accentGrad)" stroke-width="1.2"/>
  <text x="100" y="167" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">2026</text>
</svg>
